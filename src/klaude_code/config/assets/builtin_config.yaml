# ######################################## deepseek ########################################
# DeepSeek V4 pricing (CNY / million tokens, effective 2026-08-17):
# peak hours are Beijing time 09:00-12:00 and 14:00-18:00 at 2x the off-peak price.
- provider_name: deepseek
  protocol: anthropic
  api_key: ${DEEPSEEK_API_KEY}
  base_url: https://api.deepseek.com/anthropic
  model_list:

  - model_name: deepseek-flash
    model_alias: [ dsf, v4-flash, v4-flash:no-thinking, deepseek-flash:no-thinking ]
    model_id: deepseek-v4-flash
    context_limit: 1000000
    thinking:
      type: disabled
    cost: &deepseek_flash_cost
      input: 1.5
      output: 4.5
      cache_read: 0.05
      currency: CNY
      peak:
        windows: [ "09:00-12:00", "14:00-18:00" ]
        timezone: Asia/Shanghai
        input: 3
        output: 9
        cache_read: 0.1

  - model_name: deepseek-flash:high
    model_alias: [ dsfh, v4-flash:high ]
    model_id: deepseek-v4-flash
    context_limit: 1000000
    effort: high
    thinking:
      type: enabled
    cost: *deepseek_flash_cost

  - model_name: deepseek-flash:max
    model_alias: [ dsfmax, v4-flash:max ]
    model_id: deepseek-v4-flash
    context_limit: 1000000
    effort: max
    thinking:
      type: enabled
    cost: *deepseek_flash_cost

  - model_name: deepseek
    model_alias: [ ds, deepseek-pro, deepseek-pro:high, v4-pro, v4-pro:high ]
    model_id: deepseek-v4-pro
    context_limit: 1000000
    effort: high
    thinking:
      type: enabled
    cost: &deepseek_pro_cost
      input: 4.5
      output: 13.5
      cache_read: 0.15
      currency: CNY
      peak:
        windows: [ "09:00-12:00", "14:00-18:00" ]
        timezone: Asia/Shanghai
        input: 9
        output: 27
